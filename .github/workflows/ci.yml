name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust tests (cargo test --workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # apps/desktop/src-tauri is a workspace member, so `cargo test
      # --workspace` compiles it too — needs Tauri's Linux system libs
      # (webkit2gtk etc.), not just cargo. See
      # https://v2.tauri.app/start/prerequisites/
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --locked

  js:
    name: JS/TS tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm -r test
        run: pnpm -r test
